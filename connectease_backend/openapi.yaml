      responses:
        '200':
          description: User's community posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityPostDTO'
              example:
                - postId: p1b2c3d4-e5f6-7890-abcd-ef1234567890
                  title: Best PG in Gachibowli?
                  description: Looking for recommendations
                  image: null
                  time: "2025-03-10T14:22:00"
