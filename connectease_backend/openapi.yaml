  # ════════════════════════════════════════════════════════════════════════════
  # CHAT
  # ════════════════════════════════════════════════════════════════════════════

  /api/chat/start/{vendorId}:
    get:
      tags: [Chat]
      summary: Open or initialize a chat session with a vendor
      operationId: startChat
      description: >
        Returns the existing session if one already exists between the logged-in
        user and the target vendor, otherwise creates a new session.
        Use the returned `sessionId` to connect via WebSocket.

        **WebSocket (STOMP over SockJS):**

        - Connect: `ws://localhost:8081/ws-chat`
        - Subscribe: `/topic/session/{sessionId}`
        - Send messages to: `/app/chat.sendMessage`
        - Message payload: `{ "sessionId": "...", "content": "Hello!" }`
      security:
        - cookieAuth: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
      responses:
        '200':
          description: Chat session with history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
              example:
                sessionId: cs1b2c3d-e5f6-7890-abcd-ef1234567890
                participantName: CleanPro Services
                participantImage: https://cdn.example.com/avatars/cleanpro.jpg
                messages:
                  - messageId: m1a2b3c4-d5e6-7890-abcd-ef1234567890
                    senderId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    senderName: Ravi Kumar
                    senderImage: null
                    content: Hi, is your service available this weekend?
                    createdAt: "2025-03-10T15:30:00"
        '401':
          description: Unauthorized — must be logged in

  # ════════════════════════════════════════════════════════════════════════════
  # AI CHAT
  # ════════════════════════════════════════════════════════════════════════════

  /api/v1/ai-chat/ask:
    post:
      tags: [AI Chat]
      summary: Natural language service search via Gemini AI
      operationId: askAI
      description: >
        Sends a natural language query to Google Gemini 2.5 Flash.
        Gemini extracts structured intent (keyword, city, area, maxPrice, minRating)
        and the backend runs a database search, returning matching service cards.
        Valid categories: PGs, Food, Electrical service, plumbing service, cleaning service, laundry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIChatRequest'
            example:
              query: I need a good PG in Gachibowli under 8000 rupees
      responses:
        '200':
          description: AI reply with matching service cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatResponse'
              example:
                aiMessage: "Here are the top PGs I found in Gachibowli within your budget:"
                cards:
                  - sid: s1b2c3d4-e5f6-7890-abcd-ef1234567890
                    name: Sunrise PG for Boys
                    description: Fully furnished rooms with Wi-Fi and meals included
                    price: 7500.00
                    categoryName: PGs
                    city: Hyderabad
                    area: Gachibowli
                    primaryImageUrl: https://cdn.example.com/services/pg1.jpg
        '400':
          description: Empty or missing query field

  # ════════════════════════════════════════════════════════════════════════════
  # LOCATIONS
  # ════════════════════════════════════════════════════════════════════════════

  /api/locations/cities:
    get:
      tags: [Locations]
      summary: Get all unique cities that have services
      operationId: getCities
      description: Useful for populating city filter dropdowns on the frontend.
      responses:
        '200':
          description: Alphabetically sorted list of city names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - Bangalore
                - Chennai
                - Hyderabad
                - Mumbai
                - Pune

  /api/locations/cities/{city}/areas:
    get:
      tags: [Locations]
      summary: Get all areas within a specific city
      operationId: getAreasByCity
      description: Useful for populating area filter dropdowns after a city is selected.
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
          example: Hyderabad
      responses:
        '200':
          description: Alphabetically sorted list of area names in the city
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - Ameerpet
                - Gachibowli
                - Kondapur
                - Kukatpally
                - Madhapur
