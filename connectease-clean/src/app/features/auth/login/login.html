<div class="auth-container">
  <div class="auth-card">
    <div class="text-center">
      <div class="logo-box">CE</div>
      <h2>Welcome Back</h2>
      <p>Sign in to ConnectEase</p>
    </div>

    @if (errorMessage) { <div class="error-box">{{ errorMessage }}</div> }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password">
      </div>
      <button type="submit" [disabled]="loginForm.invalid" class="btn-primary w-100">Sign In</button>
    </form>
    
    <p class="switch-auth">Don't have an account? <a routerLink="/signup">Sign up</a></p>
  </div>
</div>
